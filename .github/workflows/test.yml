name: Tests

# Runs the test suite (and lint/type checks) on every push and pull request
# against main. This is the gate publish.yml never had -- until now, a tag
# push could publish to PyPI without a single test having run in CI.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy
