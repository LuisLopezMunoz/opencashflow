version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opencashflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-opencashflow}
      POSTGRES_DB: ${POSTGRES_DB:-opencashflow}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opencashflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  opencashflow:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - OCF_SECRET_KEY=${OCF_SECRET_KEY:-change-this-in-production}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-opencashflow}:${POSTGRES_PASSWORD:-opencashflow}@db:5432/${POSTGRES_DB:-opencashflow}
    restart: unless-stopped

volumes:
  pgdata:
