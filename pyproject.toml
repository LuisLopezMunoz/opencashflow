[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencashflow"
version = "0.6.0"
description = "Motor de proyección de flujo de caja: modelos SQLAlchemy, engine de cálculo y schemas Pydantic, agnóstico de framework web y de ledger."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.5,<3",
]

[project.urls]
Homepage = "https://github.com/LuisLopezMunoz/opencashflow"

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/opencashflow"]
