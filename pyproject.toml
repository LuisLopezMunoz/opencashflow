[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencashflow"
version = "0.11.1"
description = "Motor de proyección de flujo de caja: modelos SQLAlchemy, engine de cálculo y schemas Pydantic, agnóstico de framework web y de ledger."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Luis Alfredo López", email = "luis@bmya.cl" },
]
keywords = ["cashflow", "finance", "budgeting", "sqlalchemy", "projection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.5,<3",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/LuisLopezMunoz/opencashflow"
Repository = "https://github.com/LuisLopezMunoz/opencashflow"
Issues = "https://github.com/LuisLopezMunoz/opencashflow/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
opencashflow = "opencashflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencashflow"]
