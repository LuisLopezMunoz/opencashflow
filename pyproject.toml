[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opencashflow"
version = "0.15.0"
description = "Motor de proyección de flujo de caja: modelos SQLAlchemy, engine de cálculo y schemas Pydantic, agnóstico de framework web y de ledger."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "Luis Alfredo López", email = "luis@bmya.cl" },
]
keywords = ["cashflow", "finance", "budgeting", "sqlalchemy", "projection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Financial :: Accounting",
]
dependencies = [
    "sqlalchemy>=2.0,<3",
    "pydantic>=2.5,<3",
    "pyyaml>=6,<7",
]

[project.urls]
Homepage = "https://github.com/LuisLopezMunoz/opencashflow"
Repository = "https://github.com/LuisLopezMunoz/opencashflow"
Issues = "https://github.com/LuisLopezMunoz/opencashflow/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
opencashflow = "opencashflow.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opencashflow"]

[tool.ruff]
line-length = 100
target-version = "py310"
# cli.py/cli_export.py are the CLI layer -- out of scope for this
# remediation pass (reviewed/maintained separately from the core library).
# They have a handful of pre-existing lint issues (unused imports) as of
# this writing, predating any change made here. Remove this exclusion once
# those are cleaned up, or once CLI-layer linting is set up on its own
# terms -- don't let it silently become permanent.
extend-exclude = ["src/opencashflow/cli.py", "src/opencashflow/cli_export.py"]

[tool.ruff.lint]
# Starter baseline: default rule set only (pyflakes + a slice of pycodestyle).
# The codebase has no lint history, so nothing stricter is enabled yet -- this
# is meant to grow over time, not land as a wall of unrelated fixes on day one.
select = ["E", "F", "W"]
# E501 (line-too-long) alone accounts for 444/456 violations on the existing
# codebase -- almost all in test files with long parametrized asserts. Fixing
# those is pure reflow churn unrelated to any actual bug; revisit once/if a
# formatter (ruff format / black) is adopted to handle wrapping automatically.
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# Whole core now, cli.py/cli_export.py excluded to match ruff's own
# extend-exclude above (out of scope, reviewed/maintained separately).
# This used to be a narrow files=[enums.py, models.py] allowlist: every
# model in this package used the legacy Column(...) declarative style,
# under which mypy sees every ORM instance attribute as Column[X] instead
# of X, no matter what Base is -- reading one from engine.py/period_close.py/
# etc. flooded mypy with ~90 spurious "Column[int] vs int" errors unrelated
# to any real bug. Migrating every model to SQLAlchemy 2.0's Mapped[]/
# mapped_column() style (see MIGRATIONS.md/git history) fixed that at the
# root instead of working around it file by file; the ~25 real errors that
# migration then surfaced (genuine null-safety gaps, a couple of variable-
# name collisions across loops, two `str` vs Literal[...] boundary casts)
# were fixed alongside it, so this list could go straight to "everything
# except the CLI" rather than growing one file at a time.
files = ["src/opencashflow"]
exclude = [
    "^src/opencashflow/cli\\.py$",
    "^src/opencashflow/cli_export\\.py$",
]
